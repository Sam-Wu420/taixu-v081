<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B 版千人沙盒测试</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#161a17}
    #stress-panel{position:fixed;right:8px;top:8px;z-index:2147483647;width:320px;max-height:92vh;overflow:auto;padding:12px;background:#18261dec;color:#eee6ce;border:1px solid #a5926b;font:13px/1.5 system-ui}
    #stress-panel button,#stress-panel input{margin:3px;padding:5px}#stress-panel button{background:#394b3d;color:#fff5d9;border:1px solid #a5926b;cursor:pointer}
    #stress-panel input[type=number]{width:65px}#stress-panel h1{font-size:16px;margin:0 0 6px}
    #stress-results{white-space:pre-wrap;overflow-wrap:anywhere;max-height:30vh;overflow:auto;font:11px/1.3 monospace}
  </style>
</head>
<body>
  <div id="root"></div>
  <aside id="stress-panel" aria-label="千人沙盒控制台">
    <h1>千人沙盒测试</h1>
    <p id="stress-status" role="status">正在加载游戏与沙盒…</p>
    <label>总人数<input id="stress-count" type="number" min="2" max="2000" step="2" value="1000"></label>
    <label>秒数<input id="stress-seconds" type="number" min="5" max="300" value="15"></label>
    <label>轮数<input id="stress-runs" type="number" min="1" max="5" value="1"></label>
    <div><label><input id="stress-sustain" type="checkbox" checked>加高气血以维持千人负载</label></div>
    <div><button id="stress-start" disabled>开战并采样</button><button id="stress-stop" disabled>停止采样</button></div>
    <div><button id="stress-pause" disabled>暂停 / 继续</button><button id="stress-rotate" disabled>旋转 45°</button><button id="stress-hud" disabled>沙盒面板</button></div>
    <p id="stress-live"></p>
    <p>从沙盒生成同境界友敌修士，预热 5 秒后采样。加高气血只用于保持负载，结果会记录该设置。</p>
    <pre id="stress-results">尚无采样</pre>
  </aside>
  <script type="module" src="/tools/sandbox-stress.ts"></script>
</body>
</html>
